[package]
name = "tumult-analytics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Embedded analytics for Tumult — DuckDB, Arrow, Parquet"

[features]
default = ["duckdb"]
# Embedded DuckDB store plus the Arrow/Parquet ingest/export pipeline.
# Disable default features to get only the lightweight backend trait and
# shared types (AnalyticsBackend, AnalyticsError, QueryRow, StoreStats,
# telemetry) without compiling the bundled DuckDB C++ library.
duckdb = [
    "dep:duckdb",
    "dep:arrow",
    "dep:parquet",
    "dep:chrono",
    "dep:dirs-next",
    "dep:tumult-baseline",
]

[dependencies]
tumult-core = { path = "../tumult-core" }
tumult-baseline = { path = "../tumult-baseline", optional = true }
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
thiserror = { workspace = true }
chrono = { workspace = true, optional = true }
dirs-next = { workspace = true, optional = true }
opentelemetry = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
