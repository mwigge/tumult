[workspace]
resolver = "2"
members = [
    "tumult-cli",
    "tumult-core",
    "tumult-plugin",
    # Shared provider executor (used by tumult-cli and tumultd)
    "tumult-exec",
    # Shared auth primitives: RBAC roles, argon2id password hashing, token generation
    "tumult-auth",
    "tumult-authoring",
    "tumult-otel",
    # Phase 1
    "tumult-ssh",
    "tumult-net",
    # "tumult-stress",
    # "tumult-containers",
    # "tumult-process",
    # Phase 2
    "tumult-graph",
    "tumult-tui",
    "tumult-kubernetes",
    "tumult-cloud",
    "tumult-windows",
    # "tumult-db",
    # "tumult-kafka",
    # "tumult-http",
    # Phase 3
    "tumult-mcp",
    # Phase 4
    "tumult-clickhouse",
    "tumult-cypher",
    "tumult-agentic",
    "tumult-intelligence",
    "tumult-test-utils",
    # "tumult-cloud-aws",
    # "tumult-cloud-gcp",
    # "tumult-cloud-azure",
    "tumult-report",
    # Phase 5
    "tumult-agent-cli",
    # 2.15 — autopilot (pure decision logic: policy, validator, gate, ladder)
    "tumult-autopilot",
    # Passive risk scanning and the continuous resilience score (pure logic)
    "tumult-risk",
    # Performance-regression verdicts: percentiles, bootstrap CI, verdict (pure logic)
    "tumult-perf",
    # Probabilistic forecasting: provider trait, Holt-Winters, impact and recovery (pure logic)
    "tumult-forecast",
    # Imported from kronika but versioned with the workspace (version.workspace = true).
    "tumult-query",
    # Analytics platform (imported from kronika)
    "tumult-otlp",
    "tumult-lake",
    "tumult-ingest",
    "tumult-metrics",
    "tumult-compliance",
    "tumult-api",
    "tumultd",
]

[workspace.package]
version = "3.0.2"
edition = "2021"
rust-version = "1.92.0"
license = "Apache-2.0"
repository = "https://github.com/mwigge/tumult"
description = "Rust-native resilience intelligence platform with TOON format and OpenTelemetry observability"
keywords = ["resilience", "chaos-engineering", "observability", "opentelemetry", "toon"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
# Serialization + TOON
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number read back from JSON is the number that was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1.1"
toon-format = "0.5"

# Async runtime — library crates should override with minimal features
tokio = { version = "1", features = ["full"] }
tokio-minimal = { package = "tokio", version = "1", features = ["rt", "macros", "time"] }

# Userspace TCP fault-injection primitives (used by tumult-net)
tokio-netem = "0.1.1"

# CLI
clap = { version = "4", features = ["derive"] }

# OpenTelemetry
opentelemetry = { version = "0.33", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = "0.33"
opentelemetry-stdout = { version = "0.33", features = ["trace"] }

# Tracing (Rust idiomatic) + OTel bridge
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
tracing-opentelemetry = "0.34"
opentelemetry-appender-tracing = "0.33"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# HTTP server (used by tumult-agentic's fault-injecting proxy and tumult-mcp)
axum = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Analytics (Phase 2) — Arrow columnar format + Parquet + DuckDB
# NOTE: arrow/parquet track the arrow major that duckdb-rs pins (arrow 60 for
# 1.20000) for its appender-arrow/vtab-arrow interop; mixing RecordBatch types
# from two arrow majors does not compile. Bump the three together.
arrow = { version = "60", features = ["json", "ipc", "ffi"] }
parquet = { version = "60", features = ["arrow", "snap", "zstd"] }
# Schema/query JSON and Parquet archives must work without extension downloads.
duckdb = { version = "1.20000", features = ["bundled", "appender-arrow", "vtab-arrow", "json", "parquet"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Collections
indexmap = { version = "2", features = ["serde"] }

# SSH
# rsa feature disabled: RUSTSEC-2023-0071 (Marvin Attack) has no fix; RSA keys not used in tumult-ssh
russh = { version = "0.65", default-features = false, features = ["flate2", "aws-lc-rs"] }
async-trait = "0.1"

# Kubernetes
kube = { version = "4.2", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }

# MCP (Model Context Protocol)
rust-mcp-sdk = "0.9"

# Cancellation
tokio-util = "0.7"

# Unix process-group signalling (used in tumult-cli for timeout kills)
libc = "0.2"

# Pattern matching (used in tumult-core for experiment-name validation)
regex-lite = "0.1"

# Constant-time comparison (used in tumult-mcp for bearer-token auth)
subtle = "2.6"

# Secure memory zeroing for sensitive credentials (used in tumult-ssh)
zeroize = { version = "1.8", features = ["derive"] }

# ClickHouse client (used in tumult-clickhouse)
clickhouse = { version = "0.15", features = ["time", "uuid"] }

# SSH known-hosts path resolution (used in tumult-lake, tumult-ssh)
dirs-next = "2"

# Terminal UI (used by tumult-tui). ratatui bundles a crossterm backend;
# crossterm stays on the version that backend resolves.
ratatui = "0.30"
crossterm = "0.29"

# Temporary file/directory creation (dev-dependency across all crates)
tempfile = "3"

# Analytics platform crates — internal path deps
tumult-otlp = { path = "tumult-otlp" }
tumult-lake = { path = "tumult-lake" }
tumult-ingest = { path = "tumult-ingest" }
tumult-metrics = { path = "tumult-metrics" }
tumult-report = { path = "tumult-report" }
tumult-compliance = { path = "tumult-compliance" }
tumult-api = { path = "tumult-api" }
tumult-intelligence = { path = "tumult-intelligence" }
tumult-forecast = { path = "tumult-forecast" }

# OTLP receive side (tumult-otlp / tumult-ingest)
opentelemetry-proto = { version = "0.33", features = ["gen-tonic"] }
tonic = "0.14"
prost = "0.14"
# OTel-Arrow (OTAP) receive side (tumult-ingest): codec for the vendored
# arrow_service.proto and the CBOR carrier of map/array attribute values.
tonic-prost = "0.14"
tonic-prost-build = "0.14"
ciborium = "0.2"
# OTel-Arrow: IPC buffers are decompressed by the receiver itself; flatbuffers
# builds hostile IPC messages in tests and the proof probe (same versions as
# arrow-ipc).
zstd = "0.13"
flatbuffers = "25.12"

# Analytics reports, manual import, embedded web UI
serde_yaml = "0.9"
csv = "1"
typst = "0.15"
typst-pdf = "0.15"
sha2 = "0.11"
rust-embed = "8"
mime_guess = "2"

# Speed up dev builds for heavy C/C++ dependencies (DuckDB, Arrow, Parquet).
# Only affects dependencies, not workspace crates (those stay at -O0 for fast
# incremental compilation with debug info).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
# Thin LTO rather than fat: near-identical runtime performance for this IO-bound
# CLI, but far faster to build and not prone to the intermittent rustc SIGSEGV
# that fat LTO + codegen-units=1 can hit on a workspace this size. codegen-units
# stays at 16 (the default) so LTO units compile in parallel.
lto = "thin"
codegen-units = 16
panic = "abort"
# Strip only debug info, preserve symbol names for panic backtraces.
# Use `strip = true` in Dockerfiles for smaller distribution binaries.
strip = "debuginfo"

[workspace.lints.rust]
# Deny all warnings so `cargo build` outside CI is also strict.
warnings = "deny"

[workspace.lints.clippy]
# Mirror the `-W clippy::pedantic` flag used in CI and the pre-commit hook.
pedantic = "warn"
