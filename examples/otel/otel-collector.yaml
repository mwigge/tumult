# OpenTelemetry Collector in front of tumultd (Kronika) that enforces the
# resilience naming contract on whatever auto-instrumentation sends.
#
#  1. `resource`  — defaults every service must have (schema version,
#                   environment) when the SDK did not set them.
#  2. `transform` — aliases: semconv `deployment.environment(.name)` and the
#                   ICT spine (`ict.*`) are mapped onto the `resilience.*`
#                   keys the lake promotes to columns, and the other way
#                   round, so either vocabulary works end to end.
#  3. `attributes` — cardinality guard: drops request-scoped identifiers that
#                   must never become metric dimensions.
#  4. Export to tumultd over OTel-Arrow (OTAP) with the ingest token:
#     columnar, zstd-compressed batches on one long-lived gRPC stream per
#     signal, decoded straight into the Arrow-native lake. The plain OTLP
#     exporter below it is the fallback for Collector builds without the
#     otelarrow exporter (contrib only; 0.157.0 is what this example and
#     scripts/proof/otap are verified against).
receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  resource:
    attributes:
      - key: ict.schema.version
        value: "0.1.0"
        action: insert
      - key: resilience.target.environment
        from_attribute: deployment.environment.name
        action: insert
      - key: resilience.target.environment
        from_attribute: deployment.environment
        action: insert
  transform:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          # ICT spine → resilience.* (the lake's promoted columns).
          - set(attributes["resilience.target.component"], attributes["ict.entity.id"]) where attributes["resilience.target.component"] == nil and attributes["ict.entity.id"] != nil
          - set(attributes["resilience.target.criticality"], attributes["ict.entity.tier"]) where attributes["resilience.target.criticality"] == nil and attributes["ict.entity.tier"] != nil
          # resilience.* → semconv, so other backends see the environment too.
          - set(attributes["deployment.environment.name"], attributes["resilience.target.environment"]) where attributes["deployment.environment.name"] == nil and attributes["resilience.target.environment"] != nil
          # Kubernetes workload identity as the component when nothing else named it.
          - set(attributes["resilience.target.component"], Concat([attributes["k8s.namespace.name"], attributes["k8s.deployment.name"]], "/")) where attributes["resilience.target.component"] == nil and attributes["k8s.deployment.name"] != nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["resilience.target.environment"], attributes["deployment.environment.name"]) where attributes["resilience.target.environment"] == nil and attributes["deployment.environment.name"] != nil
    log_statements:
      - context: resource
        statements:
          - set(attributes["resilience.target.environment"], attributes["deployment.environment.name"]) where attributes["resilience.target.environment"] == nil and attributes["deployment.environment.name"] != nil
  attributes/cardinality:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: user.id
        action: delete
      - key: session.id
        action: delete
  batch:

exporters:
  otelarrow/tumultd:
    endpoint: ${env:TUMULTD_OTLP_ENDPOINT:-tumultd.host:14317}
    tls:
      insecure: true
    headers:
      authorization: "Bearer ${env:KRONIKA_INGEST_TOKEN}"
    # gRPC compression stays at the exporter default (zstd, announced as
    # grpc-encoding "zstdarrow5"); tumultd accepts zstdarrow1-9, zstd, gzip
    # and none. The Arrow IPC payloads are zstd-compressed as well
    # (arrow.payload_compression defaults to zstd).
    arrow:
      # Fail loudly instead of silently falling back to unary OTLP when the
      # Arrow stream cannot be established.
      disable_downgrade: true
      num_streams: 2
      max_stream_lifetime: 30s
  # OTLP fallback: same endpoint and token, unary gRPC. Swap it into the
  # pipelines below on a Collector without the otelarrow exporter.
  # otlp/tumultd:
  #   endpoint: ${env:TUMULTD_OTLP_ENDPOINT:-tumultd.host:14317}
  #   tls:
  #     insecure: true
  #   headers:
  #     authorization: "Bearer ${env:KRONIKA_INGEST_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, transform, attributes/cardinality, batch]
      exporters: [otelarrow/tumultd]
    metrics:
      receivers: [otlp]
      processors: [resource, transform, batch]
      exporters: [otelarrow/tumultd]
    logs:
      receivers: [otlp]
      processors: [resource, transform, attributes/cardinality, batch]
      exporters: [otelarrow/tumultd]
