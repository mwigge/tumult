[package]
name = "tumult-intelligence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AI-assisted recommendations for Tumult chaos experiments"

[lib]
name = "tumult_intelligence"
path = "src/lib.rs"

[dependencies]
tumult-agent-cli = { path = "../tumult-agent-cli" }
tumult-lake = { path = "../tumult-lake" }
tumult-core = { path = "../tumult-core" }
tumult-plugin = { path = "../tumult-plugin" }
serde = { workspace = true }
serde_json = { workspace = true }
toon-format = { workspace = true }
# OpenAI-compatible HTTP client + SQL guardrails (llm / sql_guard modules)
async-trait = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
# Locked-down read-only DuckDB connection behind /api/ask (locked_reader).
duckdb.workspace = true

[dev-dependencies]
# Integration tests build synthetic analytics stores and plugin manifests.
tempfile = { workspace = true }
tumult-lake = { path = "../tumult-lake" }
tumult-core = { path = "../tumult-core" }
tumult-plugin = { path = "../tumult-plugin" }
toon-format = { workspace = true }
serde_json = { workspace = true }

