[package]
name = "tumult-otel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenTelemetry instrumentation for the Tumult resilience intelligence platform"

[dependencies]
serde = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-stdout = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tokio-minimal = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing-log = "0.2"
thiserror = { workspace = true }

[dev-dependencies]
# Required for ManualReader and SdkMeterProvider in behavioral metric tests (TEST-01).
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tumult-test-utils = { path = "../tumult-test-utils", default-features = false }

