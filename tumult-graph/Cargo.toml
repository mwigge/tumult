[package]
name = "tumult-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Token-efficient knowledge graph over Tumult chaos data (nodes/edges model + SQL)"

[dependencies]
tumult-core = { path = "../tumult-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
