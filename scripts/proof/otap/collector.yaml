# OpenTelemetry Collector (contrib) used by scripts/proof/otap/proof.sh:
# OTLP/HTTP in from curl, OTel-Arrow out to tumultd for all three signals,
# no fallback to OTLP.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:PROOF_COLLECTOR_PORT}

processors:
  batch:
    timeout: 200ms

exporters:
  otelarrow/tumultd:
    endpoint: 127.0.0.1:${env:PROOF_GRPC_PORT}
    tls:
      insecure: true
    # No `compression` key: the exporter default (zstd, sent as
    # grpc-encoding zstdarrow5) is what the daemon must accept.
    headers:
      authorization: "Bearer ${env:KRONIKA_INGEST_TOKEN}"
    arrow:
      disable_downgrade: true
      # One long-lived stream per signal, so the second batch the proof
      # sends is a continuation of the first one's schemas and dictionaries.
      num_streams: 1
      max_stream_lifetime: 5m
    retry_on_failure:
      enabled: false

service:
  telemetry:
    logs:
      level: info
    # No metrics listener: the container shares the host's network.
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otelarrow/tumultd]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otelarrow/tumultd]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otelarrow/tumultd]
