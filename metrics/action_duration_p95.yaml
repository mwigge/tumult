# The 95th percentile of the fault-action duration, over the
# resilience.action spans in the window, grouped by the tumult plugin that
# served the action. The duration of a span is kept in nanoseconds.
name: action_duration_p95
description: 95th percentile of the action duration, per plugin.
unit: nanoseconds
source_table: spans
time_col: ts_ns
measure:
  type: quantile
  column: duration_ns
  quantile: 0.95
dimensions: [plugin_name]
condition: { column: span_name, equals: "resilience.action" }
