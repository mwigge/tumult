[package]
name = "tumultd"
description = "Tumult daemon — OTLP ingest servers, manual import, ad-hoc reports"
version = "0.7.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tumultd"
path = "src/main.rs"

[dependencies]
tumult-intelligence.workspace = true
tumult-lake.workspace = true
tumult-ingest.workspace = true
tumult-metrics.workspace = true
tumult-report.workspace = true
tumult-api.workspace = true
tumult-exec = { path = "../tumult-exec" }
tumult-otel = { path = "../tumult-otel" }
tumult-auth = { path = "../tumult-auth" }
axum.workspace = true
axum-server = { version = "0.7", features = ["tls-rustls"] }
# The workspace dependency graph compiles both rustls crypto providers
# (ring + aws-lc-rs); tumultd installs aws-lc-rs as the process default so
# ServerConfig construction is unambiguous.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tonic.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
async-trait.workspace = true
