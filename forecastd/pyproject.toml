[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tumult-forecastd"
version = "0.1.0"
description = "Timestral forecasting sidecar for the Tumult daemon: POST /forecast, GET /healthz"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# The ASGI stack; without it `python -m forecastd` uses the stdlib server.
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
# Timestral pulls in PyTorch (>= 2.4). Install from the upstream repository:
#   pip install 'git+https://github.com/mistralai/timestral.git'
# It is not on PyPI, so it cannot be a resolvable extra here.
timestral = ["torch>=2.4", "safetensors>=0.4", "huggingface_hub>=0.24"]

[project.scripts]
tumult-forecastd = "forecastd.__main__:main"

[tool.setuptools.packages.find]
include = ["forecastd*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
