[package]
name = "tumult-clickhouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ClickHouse analytics backend for Tumult — shared storage with SigNoz"

[dependencies]
tumult-core = { path = "../tumult-core" }
# default-features = false: only the lightweight backend trait + shared types,
# NOT the embedded DuckDB store (avoids compiling the bundled DuckDB C++ library).
tumult-lake = { path = "../tumult-lake", default-features = false }
tumult-otel = { path = "../tumult-otel" }
clickhouse = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
# Minimal tokio features — library crate
tokio = { version = "1", features = ["rt", "time"] }
thiserror = { workspace = true }
opentelemetry = { workspace = true }
tracing = { workspace = true }


[dev-dependencies]
tumult-test-utils = { path = "../tumult-test-utils", default-features = false, features = ["otel"] }
# test-util: an in-process HTTP server that stands in for ClickHouse.
clickhouse = { workspace = true, features = ["test-util"] }
# test-util: a paused clock, so backoff is measured without waiting for it.
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
