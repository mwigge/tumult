# OTel Collector configuration for the Grafana stack
#
# Routes Tumult telemetry to:
#   - Tempo  (traces,  via OTLP gRPC)
#   - Mimir  (metrics, via Prometheus remote write)
#   - Loki   (logs,    via OTLP HTTP — Loki 3.x native OTLP ingestion)
#
# Tested against otel/opentelemetry-collector-contrib:0.157.0, which
# renamed exporter kinds (otlp→otlp_grpc, otlphttp→otlp_http,
# prometheusremotewrite→prometheus_remote_write). The old names still
# work as deprecated aliases; on contrib < 0.154 use those instead.
# Note: the contrib `loki` exporter is deprecated (removed from recent
# contrib builds); use the otlp_http exporter against Loki's `/otlp`
# endpoint instead.
#
# Prerequisites (see docker/docker-compose.grafana-full.yml):
#   - Grafana Tempo at tempo:4317
#   - Grafana Mimir at mimir:9009
#   - Grafana Loki  at loki:3100
#
# Usage:
#   otelcol-contrib --config otel-collector-grafana.yaml

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: service.name
        value: tumult
        action: upsert

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus_remote_write/mimir:
    endpoint: http://mimir:9009/api/v1/push

  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus_remote_write/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/loki]

  telemetry:
    logs:
      level: info
