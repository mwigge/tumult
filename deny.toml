# cargo-deny configuration for the Tumult workspace.
# Run with: cargo deny check

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "transitive through syntect/toon-format; no direct replacement is currently exposed" },
    { id = "RUSTSEC-2024-0436", reason = "transitive through maintained dependencies including parquet and ratatui" },
    { id = "RUSTSEC-2025-0134", reason = "transitive through axum-server/rust-mcp-sdk" },
    { id = "RUSTSEC-2025-0141", reason = "both versions are transitive through syntect and grafeo; no safe compatible upgrade is available" },
    # quick-xml 0.38 is pinned by citationberg -> hayagriva -> typst 0.15.
    # tumult-compliance renders bundled, trusted Typst templates only and
    # never parses untrusted XML; no 0.38.x backport exists, so this stands
    # until typst/hayagriva move to quick-xml >= 0.41.
    { id = "RUSTSEC-2026-0194", reason = "transitive via typst/hayagriva; only trusted bundled templates are rendered, no untrusted XML parsed" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via typst/hayagriva; only trusted bundled templates are rendered, no untrusted XML parsed" },
    # Unmaintained font-stack crates pinned by typst 0.15 / krilla; no safe
    # upgrade is available until typst moves to skrifa/fontations.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser transitive via typst; no safe upgrade available" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz transitive via typst/krilla; no safe upgrade available" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
