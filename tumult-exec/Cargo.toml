[package]
name = "tumult-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Provider-dispatch activity executor shared by the tumult CLI and tumultd"

[dependencies]
tumult-core = { path = "../tumult-core" }
tumult-plugin = { path = "../tumult-plugin" }
tumult-kubernetes = { path = "../tumult-kubernetes" }
tumult-ssh = { path = "../tumult-ssh" }
tumult-net = { path = "../tumult-net" }
tumult-cloud = { path = "../tumult-cloud" }
tumult-windows = { path = "../tumult-windows" }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tumult-test-utils = { path = "../tumult-test-utils", default-features = false, features = ["otel"] }

[lints]
workspace = true
