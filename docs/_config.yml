title: Tumult
description: Rust-native resilience intelligence. Chaos experiments, load and performance runs and OpenTelemetry telemetry go into one lake; scores, verdicts, forecasts and evidence reports come out
url: "https://tumult.rs"
baseurl: ""

remote_theme: just-the-docs/just-the-docs@v0.10.1

# Site settings
logo: "/images/tumult-logo.svg"
# A small PNG for browsers that show no SVG icon; _includes/head_custom.html
# adds the SVG one.
favicon_ico: "/images/favicon.png"

# Navigation
nav_sort: case_insensitive

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Colour scheme: the light tokens of the product UI (web/src/lib/theme.css),
# defined in _sass/color_schemes/tumult.scss
color_scheme: tumult

# Draw the mermaid blocks. The theme loads this version from jsDelivr.
mermaid:
  version: "11.17.2"

# Footer
footer_content: "Tumult is open source under the Apache-2.0 license."

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Exclude from build
exclude:
  - "*.drawio"
  - "architecture/"
  - "plans/"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
