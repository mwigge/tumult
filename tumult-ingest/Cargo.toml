[package]
name = "tumult-ingest"
description = "OTLP gRPC/HTTP ingest + manual importers writing into tumult-lake"
version = "0.7.0"
edition.workspace = true
license.workspace = true

[dependencies]
tumult-lake.workspace = true
tumult-otlp.workspace = true
tumult-core = { path = "../tumult-core" }
tumult-auth = { path = "../tumult-auth" }
tumult-autopilot = { path = "../tumult-autopilot" }
opentelemetry-proto.workspace = true
reqwest.workspace = true
sha2.workspace = true
hmac = "0.12"
# zstd/gzip: the Collector's otelarrow exporter compresses at the gRPC level.
tonic = { workspace = true, features = ["tls-aws-lc", "zstd", "gzip"] }
tonic-prost.workspace = true
prost.workspace = true
# OTel-Arrow payloads are Arrow IPC streams, zstd-compressed by default.
arrow = { workspace = true, features = ["ipc_compression"] }
ciborium.workspace = true
zstd.workspace = true
flatbuffers = { workspace = true, optional = true }
axum.workspace = true
tokio.workspace = true
tokio-util = { workspace = true }
uuid = { workspace = true }
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
thiserror.workspace = true
tracing.workspace = true
dirs-next.workspace = true

[features]
# Compiles the generated OTel-Arrow gRPC clients. The daemon only serves, so
# production builds leave them out; tests and the proof probe use them.
otap-client = ["dep:flatbuffers"]

[dev-dependencies]
# Regenerates src/otap/proto.rs in tests/otap_proto_drift.rs.
tonic-prost-build.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
flatbuffers.workspace = true

[[example]]
name = "otap_probe"
required-features = ["otap-client"]
