[package]
name = "tumult-ingest"
description = "OTLP gRPC/HTTP ingest + manual importers writing into tumult-lake"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tumult-lake.workspace = true
tumult-otlp.workspace = true
tumult-core = { path = "../tumult-core" }
tumult-auth = { path = "../tumult-auth" }
tumult-autopilot = { path = "../tumult-autopilot" }
opentelemetry-proto.workspace = true
reqwest.workspace = true
sha2.workspace = true
hmac = "0.12"
# zstd/gzip: the Collector's otelarrow exporter compresses at the gRPC level.
tonic = { workspace = true, features = ["tls-aws-lc", "zstd", "gzip"] }
tonic-prost.workspace = true
prost.workspace = true
# OTel-Arrow payloads are Arrow IPC streams, zstd-compressed by default.
arrow = { workspace = true, features = ["ipc_compression"] }
ciborium.workspace = true
zstd.workspace = true
# gzip bodies on OTLP/HTTP; the crate tonic already brings for gzip on gRPC.
flate2 = "1"
# The gRPC listener does the TLS handshake itself, to know when it is done.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
# Keepalive on accepted sockets: tonic sets it only on its own listener.
socket2 = { version = "0.6", features = ["all"] }
flatbuffers = { workspace = true, optional = true }
axum.workspace = true
tokio.workspace = true
tokio-util = { workspace = true }
uuid = { workspace = true }
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
thiserror.workspace = true
tracing.workspace = true
dirs-next.workspace = true

[features]
# Compiles the generated OTel-Arrow gRPC clients. The daemon only serves, so
# production builds leave them out; tests and the proof probe use them.
otap-client = ["dep:flatbuffers"]

[dev-dependencies]
# Regenerates src/otap/proto.rs in tests/otap_proto_drift.rs.
tonic-prost-build.workspace = true
tempfile.workspace = true
# A paused clock for the connection time limits.
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tracing-subscriber.workspace = true
flatbuffers.workspace = true
# Captures what a purge logs (`logging::testing`).
tumult-otel = { path = "../tumult-otel" }
# `EnvGuard` for the tests that read configuration from the environment.
tumult-test-utils = { path = "../tumult-test-utils", default-features = false }

[[example]]
name = "otap_probe"
required-features = ["otap-client"]
