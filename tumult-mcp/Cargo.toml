[package]
name = "tumult-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP server adapter exposing Tumult chaos engineering as tools"

[lib]
name = "tumult_mcp"
path = "src/lib.rs"

[[bin]]
name = "tumult-mcp"
path = "src/main.rs"

[dependencies]
tumult-core = { path = "../tumult-core" }
tumult-analytics = { path = "../tumult-analytics" }
tumult-graph = { path = "../tumult-graph" }
tumult-plugin = { path = "../tumult-plugin" }
tumult-authoring = { path = "../tumult-authoring" }
tumult-otel = { path = "../tumult-otel" }
tumult-agentic = { path = "../tumult-agentic" }
tumult-agent-cli = { path = "../tumult-agent-cli" }
tumult-intelligence = { path = "../tumult-intelligence" }
tumult-kubernetes = { path = "../tumult-kubernetes" }
tumult-ssh = { path = "../tumult-ssh" }
tumult-net = { path = "../tumult-net" }
tumult-cloud = { path = "../tumult-cloud" }
rust-mcp-sdk = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toon-format = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
opentelemetry = { workspace = true }
subtle = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
