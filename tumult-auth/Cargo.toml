[package]
name = "tumult-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared authentication primitives for the Tumult platform: RBAC roles, argon2id password hashing, and token generation"

[lib]
name = "tumult_auth"
path = "src/lib.rs"

[dependencies]
# The same argon2 that ssh-key (via russh) resolves, so the tree keeps
# exactly one argon2 build. The 0.5 line is not API-compatible with the
# usage in src/lib.rs (0.6 moved salt generation inside `hash_password`).
argon2 = "0.6.0"
# OS randomness for salts, session ids, and tokens (same single copy argon2 uses).
getrandom = "0.4"
sha2 = { workspace = true }
subtle = { workspace = true }
