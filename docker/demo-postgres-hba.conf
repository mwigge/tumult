# Who may connect to demo-postgres. The rules of the postgres image, and one
# more: the standby of the demo copies the primary and streams from it over
# the network (pg_basebackup, then replication). LOCAL TESTING ONLY.
local   all          all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
local   replication  all                  trust
host    replication  all   127.0.0.1/32   trust
host    replication  all   ::1/128        trust
host    replication  all   all            scram-sha-256
host    all          all   all            scram-sha-256
