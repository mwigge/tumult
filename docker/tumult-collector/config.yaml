# Tumult OTel Collector — Production Configuration
#
# Receives telemetry from Tumult CLI and infrastructure, exports to:
#   - ClickHouse (persistent trace storage, standard otel_traces schema)
#   - File (JSONL for DuckDB ingestion)
#   - Prometheus (host metrics + APM span-derived RED metrics)
#
# Signals: traces, metrics, logs
#
# Environment variable overrides:
#   CLICKHOUSE_ENDPOINT  — ClickHouse native protocol (default: tcp://signoz-clickhouse:9000)
#   SIGNOZ_ENDPOINT      — Forward to SigNoz collector (optional, for SigNoz profile)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  otelarrow:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      load: {}
      network: {}
      filesystem: {}

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.id:
          enabled: true

  attributes/tumult:
    actions:
      - key: collector.name
        value: tumult-otel-collector
        action: upsert

  # Cross-client agentic telemetry normalization (see
  # collector/otel-agentic-normalization.yaml for the standalone reference).
  # Tags every signal with tumult.client and lifts Claude Code's native
  # llm_request keys onto the canonical gen_ai.* schema so the four agentic
  # clients correlate by attribute regardless of native shape.
  transform/normalize:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["tumult.client"], "unknown") where attributes["tumult.client"] == nil
      - context: span
        statements:
          - set(attributes["gen_ai.request.model"], attributes["model"])
              where name == "claude_code.llm_request" and attributes["model"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"])
              where name == "claude_code.llm_request" and attributes["input_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"])
              where name == "claude_code.llm_request" and attributes["output_tokens"] != nil
          - set(attributes["gen_ai.response.finish_reasons"], [attributes["stop_reason"]])
              where name == "claude_code.llm_request" and attributes["stop_reason"] != nil
          - set(attributes["gen_ai.operation.name"], "chat")
              where name == "claude_code.llm_request" and attributes["gen_ai.operation.name"] == nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["tumult.client"], "unknown") where attributes["tumult.client"] == nil
    log_statements:
      - context: resource
        statements:
          - set(attributes["tumult.client"], "unknown") where attributes["tumult.client"] == nil

exporters:
  # ClickHouse — standard OTel schema (otel_traces table)
  # Coexists with SigNoz's signoz_index_v3 in the same database
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT:-tcp://signoz:9000}
    database: signoz_traces
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    sending_queue:
      enabled: true
      queue_size: 100

  # Prometheus — host + APM metrics for scraping
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # OTLP forward — send to SigNoz OTel Collector for signoz_index_v3
  otlp/signoz:
    endpoint: ${env:SIGNOZ_ENDPOINT:-signoz:4317}
    tls:
      insecure: true

  # Debug — development logging
  debug:
    verbosity: basic

connectors:
  # APM: Derive RED metrics (Rate, Errors, Duration) from traces
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 5ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1s, 5s, 10s]
    dimensions:
      - name: resilience.experiment.title
      - name: resilience.action.name
      - name: resilience.fault.type
    exemplars:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]

  pipelines:
    # Traces: OTLP/Arrow -> ClickHouse + SigNoz + APM metrics
    traces:
      receivers: [otlp, otelarrow]
      processors: [memory_limiter, resourcedetection, attributes/tumult, transform/normalize, batch]
      exporters: [clickhouse, otlp/signoz, debug, spanmetrics]

    # Metrics: OTLP/Arrow + host metrics -> SigNoz + Prometheus
    metrics:
      receivers: [otlp, otelarrow, hostmetrics]
      processors: [memory_limiter, resourcedetection, attributes/tumult, transform/normalize, batch]
      exporters: [otlp/signoz, prometheus]

    # APM: Span-derived RED metrics -> Prometheus
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]

    # Logs: OTLP -> SigNoz
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/tumult, transform/normalize, batch]
      exporters: [otlp/signoz, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
