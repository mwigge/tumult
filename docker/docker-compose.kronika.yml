# One-command Krönika demo: tumultd + REAL tumult chaos experiments + the
# web UI.
#
#   docker compose -f docker/docker-compose.kronika.yml up
#
# Then open http://localhost:14318/ — the Krönika analytics UI (embedded in
# the tumultd binary): Overview KPIs, experiment drill-down with the span
# waterfall, NL Ask, scheduled Reports.
#
# Flow: tumultd comes up → `seed` runs the tumult experiment suite in
# ../demo/kronika/experiments/ with the tumult CLI built from the same
# workspace source (no release download) — genuine chaos runs emitting real
# OTLP/gRPC traces, metrics and logs → `report` also pulls one HTML report
# per semantic metric from tumultd's live `GET /report?metric=<name>`
# endpoint into ./demo-out/. The daemon itself renders a digest into
# /data/reports/ every KRONIKA_REPORT_INTERVAL (1h here), browsable on the
# UI's Reports page.
#
# Two suite experiments are designed NOT to pass (one Deviated, one Failed,
# both rolled back) so the reports show real deviations and rollbacks.
#
# Re-run the suite later against the same store (data accumulates):
#   docker compose -f docker/docker-compose.kronika.yml run --rm seed
#
# Point real tumult at localhost:14317 / smedja at localhost:14318 while the
# stack is up to mix in telemetry from outside the demo. (Host ports are
# 14317/14318 so the demo runs side-by-side with an existing collector that
# already owns the OTLP-standard 4317/4318; container-internal traffic uses
# the standard ports.)

name: tumult-kronika

services:
  tumultd:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tumultd
    image: tumult-kronika:latest
    container_name: tumult-kronika-tumultd
    ports:
      - "14317:4317"
      - "14318:4318"
    environment:
      # Render a metric digest into /data/reports/ hourly; the UI's Reports
      # page lists them via /api/reports.
      KRONIKA_REPORT_INTERVAL: 1h
      # Org hierarchy for /api/scores/tree and R1's By-domain section.
      # /data/org.yaml is the default lookup path; KRONIKA_ORG_FILE
      # overrides it (documented here for discoverability).
      # KRONIKA_ORG_FILE: /data/org.yaml
      # Parquet lake: export into /data/lake on the default 24h interval;
      # retention OFF — the demo accumulates, never deletes.
      KRONIKA_RETENTION_DAYS: "0"
      # DEMO ONLY — never for a real deployment. The daemon binds 0.0.0.0 in
      # the container, and a non-loopback bind without any user refuses to
      # start (fail-closed guard, ADR-012); the bootstrap env vars create the
      # demo's admin (must_change=false here; the real `tumultd create-admin`
      # path forces a password change) and the seed's API token on first boot.
      KRONIKA_BOOTSTRAP_ADMIN_PASSWORD: "kr0nika-demo-admin"
      KRONIKA_BOOTSTRAP_TOKEN: "kro_demo_seed_7f3a9c1e5b2d84f06a1c3e597bfd4208e6a91d4c0f2b5e83a7d6c1940f2e"
      # OTLP ingest (/v1/* HTTP + gRPC) requires this bearer token; /healthz
      # stays open so the healthcheck above keeps working.
      KRONIKA_INGEST_TOKEN: "kro_demo_ingest_9e1f4b7a2c5d8063f1a4b7d0e3c6f9a2b5d8e1f4a7c0d3e6b9f2a5c8d1e4"
    volumes:
      - tumult-kronika-data:/data
      - ../demo/kronika/org.yaml:/data/org.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4318/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  seed:
    image: tumult-kronika:latest
    container_name: tumult-kronika-seed
    # Runs the real tumult experiment suite with the workspace-built tumult
    # binary. HOME=/tmp keeps tumult's state writable (the kronika user has
    # no writable home in this container); journals stay in /tmp (ephemeral —
    # tumultd is the record). TUMULT_DAEMON_URL sends each journal to the
    # daemon's /api/import/journal, so the analytics tables (experiments,
    # activity_results, graph) fill in through the daemon's single writer.
    # The suite must finish even when an experiment deviates or fails
    # (tumult exits non-zero on both), so failures are tallied, not fatal.
    environment:
      HOME: /tmp
      TUMULT_OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tumultd:4317
      # Authenticated OTLP: the daemon's ingest requires KRONIKA_INGEST_TOKEN
      # (see the tumultd service); the standard OTEL headers env carries it.
      OTEL_EXPORTER_OTLP_HEADERS: "authorization=Bearer kro_demo_ingest_9e1f4b7a2c5d8063f1a4b7d0e3c6f9a2b5d8e1f4a7c0d3e6b9f2a5c8d1e4"
      OTEL_SERVICE_NAME: tumult
      TUMULT_DAEMON_URL: http://tumultd:4318
      # Daemon API token (provisioned by KRONIKA_BOOTSTRAP_TOKEN on the
      # tumultd service) for the CLI's journal import and the manual-evidence
      # curls below.
      TUMULT_DAEMON_TOKEN: "kro_demo_seed_7f3a9c1e5b2d84f06a1c3e597bfd4208e6a91d4c0f2b5e83a7d6c1940f2e"
    volumes:
      - ../demo/kronika/experiments:/experiments:ro
    command:
      - sh
      - -c
      - |
        passed=0; notpassed=0
        for f in /experiments/*.toon; do
          n=$$(basename "$$f" .toon)
          echo "=== seed: running $$n"
          if tumult run "$$f" --journal-path "/tmp/journal-$$n.toon"; then
            passed=$$((passed + 1))
            echo "=== seed: $$n -> PASSED"
          else
            notpassed=$$((notpassed + 1))
            echo "=== seed: $$n -> DEVIATED/FAILED (by design for part of the suite)"
          fi
          sleep 3
        done
        echo "=== seed: suite done — $$passed passed, $$notpassed deviated/failed"
        # Manual evidence records: one verified gameday (scores), one
        # submitted (pending verification), one draft. Idempotent-ish: re-runs
        # add another generation of records; the demo volume is disposable.
        # Auth is enabled (bootstrap admin), so the actor identity comes from
        # the credential, not the request body: admin's token authors and
        # submits; the verify step needs a SECOND identity because the store
        # enforces reviewer != enterer. bob is provisioned via the admin API
        # (one-time password -> immediate change, exercising the login +
        # must_change flow); on re-runs bob already exists with his changed
        # password.
        API=http://tumultd:4318/api
        AUTH="Authorization: Bearer $$TUMULT_DAEMON_TOKEN"
        CT='content-type: application/json'
        BOB_PW="demo-bob-one-time-pw"
        BOB_PW2="demo-bob-permanent-pw"
        curl -sf -X POST "$$API/users" -H "$$AUTH" -H "$$CT" -d "{\"username\":\"bob\",\"password\":\"$$BOB_PW\",\"role\":\"approver\"}" > /dev/null || true
        if ! curl -sf -c /tmp/bob.jar -X POST "$$API/auth/login" -H "$$CT" -d "{\"username\":\"bob\",\"password\":\"$$BOB_PW2\"}" > /dev/null; then
          curl -sf -c /tmp/bob.jar -X POST "$$API/auth/login" -H "$$CT" -d "{\"username\":\"bob\",\"password\":\"$$BOB_PW\"}" > /dev/null
          curl -sf -b /tmp/bob.jar -c /tmp/bob.jar -X POST "$$API/auth/change-password" -H "$$CT" -d "{\"current_password\":\"$$BOB_PW\",\"new_password\":\"$$BOB_PW2\"}" > /dev/null
        fi
        echo "=== seed: manual evidence records (author: admin, reviewer: bob)"
        EXEC_NS="$$(( $$(date +%s) - 172800 ))000000000"
        VID=$$(curl -sf -X POST "$$API/manual/experiments" -H "$$AUTH" -H "$$CT" -d "{\"experiment_name\":\"cdn failover — edge PoP loss\",\"exercise_type\":\"gameday\",\"executed_at_ns\":$$EXEC_NS,\"hypothesis\":\"Edge PoP loss fails over within 60s\",\"method\":\"Disabled the primary PoP during a live game day; watched traffic shift and measured warm-up\",\"outcome_status\":\"passed\",\"hypothesis_met\":true,\"findings\":\"Failover worked; warm-up took 40s during which p95 spiked\",\"action_items\":[\"Pre-warm the secondary PoP\"],\"target_system\":\"cdn\",\"target_environment\":\"production\",\"blast_radius\":\"single-pop\",\"recovery_time_s\":40.0,\"duration_s\":3600.0,\"attestation\":\"I attest this record reflects the exercise as executed, and the findings are complete to the best of my knowledge.\",\"framework_refs\":[\"DORA Art. 24(7)\",\"ISO 27001 A.5.30\"]}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
        curl -sf -X POST "$$API/manual/experiments/$$VID/submit" -H "$$AUTH" -H "$$CT" -d '{}' > /dev/null
        curl -sf -b /tmp/bob.jar -X POST "$$API/manual/experiments/$$VID/verify" -H "$$CT" -d '{"note":"evidence reviewed on call"}' > /dev/null
        echo "=== seed: verified manual gameday $$VID (admin -> bob)"
        SID=$$(curl -sf -X POST "$$API/manual/experiments" -H "$$AUTH" -H "$$CT" -d "{\"experiment_name\":\"vpn concentrator tabletop\",\"exercise_type\":\"tabletop\",\"executed_at_ns\":$$EXEC_NS,\"hypothesis\":\"VPN concentrator loss reroutes within 5 minutes\",\"method\":\"Tabletop walkthrough of the runbook with the network team\",\"outcome_status\":\"partial\",\"hypothesis_met\":true,\"findings\":\"Runbook covers the path but two steps are outdated\",\"action_items\":[\"Update the runbook\",\"Re-run as a live drill\"],\"target_system\":\"vpn\",\"target_environment\":\"production\",\"attestation\":\"I attest this record reflects the tabletop as executed.\",\"framework_refs\":[\"DORA Art. 24(7)\"]}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
        curl -sf -X POST "$$API/manual/experiments/$$SID/submit" -H "$$AUTH" -H "$$CT" -d '{}' > /dev/null
        echo "=== seed: submitted manual tabletop $$SID (awaiting verification)"
        curl -sf -X POST "$$API/manual/experiments" -H "$$AUTH" -H "$$CT" -d "{\"experiment_name\":\"dns failover drill\",\"exercise_type\":\"drill\",\"executed_at_ns\":$$EXEC_NS,\"hypothesis\":\"Secondary DNS takes over transparently\",\"method\":\"Draft record — drill planned, not yet executed\",\"outcome_status\":\"inconclusive\",\"attestation\":\"I attest this record reflects the exercise as executed.\"}" > /dev/null
        echo "=== seed: draft manual drill (stays draft)"
    depends_on:
      tumultd:
        condition: service_healthy
    restart: "no"

  report:
    image: tumult-kronika:latest
    container_name: tumult-kronika-report
    # One-shot: fetches rendered reports from tumultd's live /report
    # endpoint (DuckDB allows a single read-write process, so reports must be
    # served by the daemon, not by opening the store from this container).
    # Writes into the host bind-mounted ./demo-out; runs as root so the bind
    # mount is writable regardless of host uid, and files are chmod'ed
    # world-readable afterwards.
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        sleep 5
        mkdir -p /out
        for m in experiment_count hypothesis_pass_rate deviation_rate experiment_duration_s experiment_coverage action_duration_s; do
          curl -sf "http://tumultd:4318/report?metric=$$m" -o "/out/$$m.html"
        done
        chmod -R a+rwX /out
    volumes:
      # ../demo-out = repo root (bind sources resolve against this file's dir).
      - ../demo-out:/out
    depends_on:
      tumultd:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

volumes:
  tumult-kronika-data:
