# One-command demo: kronikad + REAL tumult chaos experiments + HTML reports.
#
#   docker compose -f docker/docker-compose.demo.yml up
#
# Flow: kronikad comes up → `seed` runs the tumult experiment suite in
# ../demo/experiments/ with the pinned tumult release binary (v2.18.0,
# checksum-verified at image build) — genuine chaos runs emitting real
# OTLP/gRPC traces, metrics and logs → `report` pulls one HTML report per
# semantic metric from kronikad's live `GET /report?metric=<name>` endpoint
# into ./demo-out/. Open e.g. demo-out/hypothesis_pass_rate.html in a browser.
#
# Two suite experiments are designed NOT to pass (one Deviated, one Failed,
# both rolled back) so the reports show real deviations and rollbacks.
#
# Optional synthetic backfill (adds 40 generated experiments spread over the
# past 14 days, for time-series shape):
#   docker compose -f docker/docker-compose.demo.yml --profile synthetic up
#
# Re-run the suite later against the same store (data accumulates):
#   docker compose -f docker/docker-compose.demo.yml run --rm seed
#
# Point real tumult at localhost:14317 / smedja at localhost:14318 while the
# stack is up to mix in telemetry from outside the demo. (Host ports are
# 14317/14318 so the demo runs side-by-side with an existing collector that
# already owns the OTLP-standard 4317/4318; container-internal traffic uses
# the standard ports.)

name: kronika-demo

services:
  kronikad:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kronika-demo:latest
    ports:
      - "14317:4317"
      - "14318:4318"
    volumes:
      - kronika-demo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4318/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  seed:
    image: kronika-demo:latest
    # Runs the real tumult experiment suite. HOME=/tmp keeps tumult's state
    # writable (the kronika user has no writable home in this container);
    # journals stay in /tmp (ephemeral — kronikad is the record). The suite
    # must finish even when an experiment deviates or fails (tumult exits
    # non-zero on both), so failures are tallied, not fatal.
    environment:
      HOME: /tmp
      TUMULT_OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://kronikad:4317
      OTEL_SERVICE_NAME: tumult
    volumes:
      - ../demo/experiments:/experiments:ro
    command:
      - sh
      - -c
      - |
        passed=0; notpassed=0
        for f in /experiments/*.toon; do
          n=$$(basename "$$f" .toon)
          echo "=== seed: running $$n"
          if tumult run "$$f" --journal-path "/tmp/journal-$$n.toon" --no-ingest; then
            passed=$$((passed + 1))
            echo "=== seed: $$n -> PASSED"
          else
            notpassed=$$((notpassed + 1))
            echo "=== seed: $$n -> DEVIATED/FAILED (by design for part of the suite)"
          fi
          sleep 3
        done
        echo "=== seed: suite done — $$passed passed, $$notpassed deviated/failed"
    depends_on:
      kronikad:
        condition: service_healthy
    restart: "no"

  # Optional synthetic backfill (kronika-demo generator) — only started with
  # `--profile synthetic`. Adds time-spread history; the primary seed above
  # is the real tumult suite.
  synthetic:
    image: kronika-demo:latest
    profiles: ["synthetic"]
    command:
      - kronika-demo
      - --endpoint
      - http://kronikad:4317
      - --experiments
      - "40"
      - --seed
      - "7"
    depends_on:
      kronikad:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

  report:
    image: kronika-demo:latest
    # One-shot: fetches rendered reports from kronikad's live /report
    # endpoint (DuckDB allows a single read-write process, so reports must be
    # served by the daemon, not by opening the store from this container).
    # Writes into the host bind-mounted ./demo-out; runs as root so the bind
    # mount is writable regardless of host uid, and files are chmod'ed
    # world-readable afterwards.
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        sleep 5
        mkdir -p /out
        for m in experiment_count hypothesis_pass_rate deviation_rate experiment_duration_s experiment_coverage action_duration_s; do
          curl -sf "http://kronikad:4318/report?metric=$$m" -o "/out/$$m.html"
        done
        chmod -R a+rwX /out
    volumes:
      # ../demo-out = repo root (bind sources resolve against this file's dir).
      - ../demo-out:/out
    depends_on:
      kronikad:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

volumes:
  kronika-demo-data:
