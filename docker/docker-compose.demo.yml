# One-command demo: kronikad + REAL tumult chaos experiments + the web UI.
#
#   docker compose -f docker/docker-compose.demo.yml up
#
# Then open http://localhost:14318/ — the kronika analytics UI (embedded in
# the kronikad binary): Overview KPIs, experiment drill-down with the span
# waterfall, NL Ask, scheduled Reports.
#
# Flow: kronikad comes up → `seed` runs the tumult experiment suite in
# ../demo/experiments/ with the pinned tumult release binary (v2.18.0,
# checksum-verified at image build) — genuine chaos runs emitting real
# OTLP/gRPC traces, metrics and logs → `report` also pulls one HTML report
# per semantic metric from kronikad's live `GET /report?metric=<name>`
# endpoint into ./demo-out/. The daemon itself renders a digest into
# /data/reports/ every KRONIKA_REPORT_INTERVAL (1h here), browsable on the
# UI's Reports page.
#
# Two suite experiments are designed NOT to pass (one Deviated, one Failed,
# both rolled back) so the reports show real deviations and rollbacks.
#
# Optional synthetic backfill (adds 40 generated experiments spread over the
# past 14 days, for time-series shape):
#   docker compose -f docker/docker-compose.demo.yml --profile synthetic up
#
# Re-run the suite later against the same store (data accumulates):
#   docker compose -f docker/docker-compose.demo.yml run --rm seed
#
# Point real tumult at localhost:14317 / smedja at localhost:14318 while the
# stack is up to mix in telemetry from outside the demo. (Host ports are
# 14317/14318 so the demo runs side-by-side with an existing collector that
# already owns the OTLP-standard 4317/4318; container-internal traffic uses
# the standard ports.)

name: kronika-demo

services:
  kronikad:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kronika-demo:latest
    ports:
      - "14317:4317"
      - "14318:4318"
    environment:
      # Render a metric digest into /data/reports/ hourly; the UI's Reports
      # page lists them via /api/reports.
      KRONIKA_REPORT_INTERVAL: 1h
      # Org hierarchy for /api/scores/tree and R1's By-domain section.
      # /data/org.yaml is the default lookup path; KRONIKA_ORG_FILE
      # overrides it (documented here for discoverability).
      # KRONIKA_ORG_FILE: /data/org.yaml
    volumes:
      - kronika-demo-data:/data
      - ../demo/org.yaml:/data/org.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4318/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  seed:
    image: kronika-demo:latest
    # Runs the real tumult experiment suite. HOME=/tmp keeps tumult's state
    # writable (the kronika user has no writable home in this container);
    # journals stay in /tmp (ephemeral — kronikad is the record). The suite
    # must finish even when an experiment deviates or fails (tumult exits
    # non-zero on both), so failures are tallied, not fatal.
    environment:
      HOME: /tmp
      TUMULT_OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://kronikad:4317
      OTEL_SERVICE_NAME: tumult
    volumes:
      - ../demo/experiments:/experiments:ro
    command:
      - sh
      - -c
      - |
        passed=0; notpassed=0
        for f in /experiments/*.toon; do
          n=$$(basename "$$f" .toon)
          echo "=== seed: running $$n"
          if tumult run "$$f" --journal-path "/tmp/journal-$$n.toon" --no-ingest; then
            passed=$$((passed + 1))
            echo "=== seed: $$n -> PASSED"
          else
            notpassed=$$((notpassed + 1))
            echo "=== seed: $$n -> DEVIATED/FAILED (by design for part of the suite)"
          fi
          sleep 3
        done
        echo "=== seed: suite done — $$passed passed, $$notpassed deviated/failed"
        # Manual evidence records (v0.5): one verified gameday (scores), one
        # submitted (pending verification), one draft. Idempotent-ish: re-runs
        # add another generation of records; the demo volume is disposable.
        API=http://kronikad:4318/api/manual/experiments
        EXEC_NS="$$(( $$(date +%s) - 172800 ))000000000"
        echo "=== seed: manual evidence records"
        VID=$$(curl -sf -X POST "$$API" -H 'content-type: application/json' -d "{\"experiment_name\":\"cdn failover — edge PoP loss\",\"exercise_type\":\"gameday\",\"executed_at_ns\":$$EXEC_NS,\"hypothesis\":\"Edge PoP loss fails over within 60s\",\"method\":\"Disabled the primary PoP during a live game day; watched traffic shift and measured warm-up\",\"outcome_status\":\"passed\",\"hypothesis_met\":true,\"findings\":\"Failover worked; warm-up took 40s during which p95 spiked\",\"action_items\":[\"Pre-warm the secondary PoP\"],\"target_system\":\"cdn\",\"target_environment\":\"production\",\"blast_radius\":\"single-pop\",\"recovery_time_s\":40.0,\"duration_s\":3600.0,\"entered_by\":\"alice\",\"attestation\":\"I attest this record reflects the exercise as executed, and the findings are complete to the best of my knowledge.\",\"framework_refs\":[\"DORA Art. 24(7)\",\"ISO 27001 A.5.30\"]}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
        curl -sf -X POST "$$API/$$VID/submit" -H 'content-type: application/json' -d '{"by":"alice"}' > /dev/null
        curl -sf -X POST "$$API/$$VID/verify" -H 'content-type: application/json' -d '{"reviewer":"bob","note":"evidence reviewed on call"}' > /dev/null
        echo "=== seed: verified manual gameday $$VID (alice -> bob)"
        SID=$$(curl -sf -X POST "$$API" -H 'content-type: application/json' -d "{\"experiment_name\":\"vpn concentrator tabletop\",\"exercise_type\":\"tabletop\",\"executed_at_ns\":$$EXEC_NS,\"hypothesis\":\"VPN concentrator loss reroutes within 5 minutes\",\"method\":\"Tabletop walkthrough of the runbook with the network team\",\"outcome_status\":\"partial\",\"hypothesis_met\":true,\"findings\":\"Runbook covers the path but two steps are outdated\",\"action_items\":[\"Update the runbook\",\"Re-run as a live drill\"],\"target_system\":\"vpn\",\"target_environment\":\"production\",\"entered_by\":\"carol\",\"attestation\":\"I attest this record reflects the tabletop as executed.\",\"framework_refs\":[\"DORA Art. 24(7)\"]}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
        curl -sf -X POST "$$API/$$SID/submit" -H 'content-type: application/json' -d '{"by":"carol"}' > /dev/null
        echo "=== seed: submitted manual tabletop $$SID (awaiting verification)"
        curl -sf -X POST "$$API" -H 'content-type: application/json' -d "{\"experiment_name\":\"dns failover drill\",\"exercise_type\":\"drill\",\"executed_at_ns\":$$EXEC_NS,\"hypothesis\":\"Secondary DNS takes over transparently\",\"method\":\"Draft record — drill planned, not yet executed\",\"outcome_status\":\"inconclusive\",\"entered_by\":\"alice\",\"attestation\":\"I attest this record reflects the exercise as executed.\"}" > /dev/null
        echo "=== seed: draft manual drill (stays draft)"
    depends_on:
      kronikad:
        condition: service_healthy
    restart: "no"

  # Optional synthetic backfill (kronika-demo generator) — only started with
  # `--profile synthetic`. Adds time-spread history; the primary seed above
  # is the real tumult suite.
  synthetic:
    image: kronika-demo:latest
    profiles: ["synthetic"]
    command:
      - kronika-demo
      - --endpoint
      - http://kronikad:4317
      - --experiments
      - "40"
      - --seed
      - "7"
    depends_on:
      kronikad:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

  report:
    image: kronika-demo:latest
    # One-shot: fetches rendered reports from kronikad's live /report
    # endpoint (DuckDB allows a single read-write process, so reports must be
    # served by the daemon, not by opening the store from this container).
    # Writes into the host bind-mounted ./demo-out; runs as root so the bind
    # mount is writable regardless of host uid, and files are chmod'ed
    # world-readable afterwards.
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        sleep 5
        mkdir -p /out
        for m in experiment_count hypothesis_pass_rate deviation_rate experiment_duration_s experiment_coverage action_duration_s; do
          curl -sf "http://kronikad:4318/report?metric=$$m" -o "/out/$$m.html"
        done
        chmod -R a+rwX /out
    volumes:
      # ../demo-out = repo root (bind sources resolve against this file's dir).
      - ../demo-out:/out
    depends_on:
      kronikad:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

volumes:
  kronika-demo-data:
