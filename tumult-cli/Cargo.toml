[package]
name = "tumult-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI binary for the Tumult chaos engineering platform"

[lib]
name = "tumult_cli"
path = "src/lib.rs"

[[bin]]
name = "tumult"
path = "src/main.rs"

[dependencies]
tumult-core = { path = "../tumult-core" }
tumult-analytics = { path = "../tumult-analytics" }
tumult-clickhouse = { path = "../tumult-clickhouse" }
tumult-plugin = { path = "../tumult-plugin" }
tumult-authoring = { path = "../tumult-authoring" }
tumult-otel = { path = "../tumult-otel" }
tumult-kubernetes = { path = "../tumult-kubernetes" }
tumult-ssh = { path = "../tumult-ssh" }
tumult-net = { path = "../tumult-net" }
tumult-cloud = { path = "../tumult-cloud" }
tumult-windows = { path = "../tumult-windows" }
tumult-agent-cli = { path = "../tumult-agent-cli" }
tumult-agentic = { path = "../tumult-agentic" }
tumult-intelligence = { path = "../tumult-intelligence" }
tumult-mcp = { path = "../tumult-mcp" }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
toon-format = { workspace = true }
serde_json = { workspace = true }
opentelemetry = { workspace = true }
tokio-util = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
indexmap = { workspace = true }
# The k6 executor's tempfile use moved to tumult-core; the CLI now only
# needs tempfile in tests.
tempfile = { workspace = true }
