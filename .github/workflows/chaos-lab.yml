name: Chaos Lab

on:
  push:
    branches: [main]
    paths: ["chaos-lab/**", ".github/workflows/chaos-lab.yml"]
  pull_request:
    branches: [main]
    paths: ["chaos-lab/**", ".github/workflows/chaos-lab.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: Build, test and recover the local lab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chaos-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chaos-lab/package-lock.json
      - name: Install development tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start from the documented quick start
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Run quality and real Tumult tests
        run: |
          mkdir -p .lab
          docker compose cp lab:/usr/local/bin/tumult .lab/tumult
          export TUMULT_TEST_BIN="$PWD/.lab/tumult"
          ./scripts/check.sh
      - name: Exercise the browser and crash recovery
        run: |
          .venv/bin/python tests/browser_live.py
          .venv/bin/python tests/restart_live.py
      - name: Show service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100 lab target
      - name: Remove the disposable CI lab
        if: always()
        run: docker compose down -v
