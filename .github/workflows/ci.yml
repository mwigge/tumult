name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# PR pipeline budget: 5-20 min. The old layout ran check, clippy, test and
# doc as four jobs that each rebuilt the whole workspace in their own cache
# namespace (~40 min wall, and every stacked-PR rebase paid it again). Now
# one job builds the workspace once and walks check → clippy → machete →
# nextest, every Rust job shares one rust-cache key (main-push runs warm it
# for PRs), nextest runs the suite process-parallel, and the doc build
# fails on any rustdoc warning. The exhaustive gates live on main
# (Coverage on every merge, 90% floor) and in the Release workflow (full
# --all-features matrix).

jobs:
  web:
    name: Web UI (Svelte SPA embedded in tumultd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      # Generate .svelte-kit/tsconfig.json before type-checking — a clean
      # checkout has no .svelte-kit, so bare svelte-check fails.
      - run: npx svelte-kit sync
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm test
      - run: npm run build
      # tumult-cli embeds the script that draws the charts of its HTML
      # report, so the built file is committed. It must be what its source
      # builds.
      - name: The script of the HTML report is in sync with its source
        run: |
          npm run build:report
          git diff --exit-code -- ../tumult-cli/src/commands/report/html/report-charts.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # stable
        with:
          toolchain: 1.92.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-workspace
      # Pinned: 0.22.0 needs a newer Rust than the workspace toolchain.
      - run: cargo install cargo-deny --version 0.21.0 --locked
      # advisories through cargo-deny (not rustsec/audit-check) so deny.toml
      # stays the single source of truth for documented exceptions.
      - run: cargo deny check advisories
      - run: cargo deny check

  test:
    name: Test
    runs-on: ubuntu-latest
    # The 2.22 cold-cache run needed 65 min before cache saving. Bundled
    # JSON/Parquet add native compilation; allow that work and cache upload
    # to finish so the next run does not repeat another cold build. The
    # 3.0 workspace (35 crates, DuckDB 2.0) was still linking after 66 min.
    timeout-minutes: 150
    env:
      # Linking the big test binaries (duckdb/parquet static libs) with full
      # debuginfo nearly fills the runner disk and ld dies with SIGBUS —
      # same fix as the Coverage job: line tables suffice.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # About a hundred test executables each link the bundled DuckDB. Its
      # C++ debug data in every one of them filled the disk again in 3.0;
      # the tests need Rust line tables only.
      CXXFLAGS: -g0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # master
        with:
          toolchain: 1.92.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Reclaim ~25 GB so linking the duckdb/parquet test binaries cannot
      # die with SIGBUS from disk pressure (same list as the Coverage job).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/share/swift /usr/share/miniconda /opt/az /usr/lib/jvm
          sudo docker system prune -af || true
          df -h /
      # tumultd rust-embeds web/build/ at compile time; without this the
      # workspace cargo steps below fail on the tumultd crate.
      - name: Build web UI (tumultd embeds web/build)
        run: npm --prefix web ci && npm --prefix web run build
      # cargo-machete is pinned: 0.10.1 does not compile on the toolchain of
      # the workspace (rust-version 1.92.0).
      - run: cargo install cargo-nextest --locked
      - run: cargo install cargo-machete --version 0.9.2 --locked
      # No separate `cargo check`: clippy --all-targets already type-checks
      # every target including tests, so a check pass first only recompiles
      # the workspace crates a second time.
      # The lints (pedantic, and print_stdout/print_stderr/dbg_macro denied)
      # are in [workspace.lints] of Cargo.toml, which every crate reads.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # tumult-clickhouse depends on tumult-lake without the duckdb feature;
      # --all-features never builds that shape.
      - run: cargo check -p tumult-lake --no-default-features
      # Fail on unused dependencies declared in Cargo.toml (respects
      # [package.metadata.cargo-machete] ignore lists).
      - run: cargo machete --with-metadata
      - run: cargo nextest run --all-features
      # A browser without a network opens the report the binary of this
      # build writes: every chart is drawn, and no text of a journal is
      # markup.
      - name: HTML report in a browser
        working-directory: web
        env:
          TUMULT_BIN: ${{ github.workspace }}/target/debug/tumult
        run: |
          npx playwright install --with-deps chromium
          npm run test:report
      # A browser opens the page of a run on the daemon of this build: a
      # real run hands it its journal, a recorded journal is imported, and
      # the page shows what the journals say.
      - name: Run page on a real daemon in a browser
        working-directory: web
        env:
          TUMULT_BIN: ${{ github.workspace }}/target/debug/tumult
          TUMULTD_BIN: ${{ github.workspace }}/target/debug/tumultd
        run: npm run test:live
      - name: Show disk use after the test build
        if: always()
        run: df -h /
      # The checked-in OTel-Arrow gRPC code must be what arrow_service.proto
      # generates (the only step that needs protoc). protoc is the pinned
      # upstream release, checked against its SHA-256, not the runner's.
      - name: OTel-Arrow generated code is in sync with its proto
        env:
          PROTOC_VERSION: "36.1"
          PROTOC_SHA256: c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          PROTOC="$RUNNER_TEMP/protoc/bin/protoc" PROTOC_INCLUDE="$RUNNER_TEMP/protoc/include" \
            cargo test -p tumult-ingest --test otap_proto_drift -- --ignored

  # The release workflow runs the full test gate on macOS. Without this
  # job a macOS-only failure first shows after the tag is pushed, as in the
  # first v3.0.0 release run. Same command as that gate, but it runs every
  # test binary instead of stopping at the first failure.
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CXXFLAGS: -g0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-macos
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # tumultd rust-embeds web/build/ at compile time.
      - name: Build web UI (tumultd embeds web/build)
        run: npm --prefix web ci && npm --prefix web run build
      - run: cargo test --workspace --all-features --no-fail-fast

  # demo/app, demo/control-panel and demo/traffic are cargo workspaces of
  # their own, so the Format and Test jobs do not reach them. Their tests
  # need no web build, no docker and no demo stack.
  demo-crates:
    name: Demo crates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: |
            demo/app
            demo/control-panel
            demo/traffic
      - run: make demo-test

  doc:
    name: Documentation
    # Runs on pull requests and on main. A broken doc link fails the pull
    # request, not main after the merge. It takes about 20 min.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ci-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # tumultd rust-embeds web/build/ at compile time; without this the
      # workspace cargo step below fails on the tumultd crate.
      - name: Build web UI (tumultd embeds web/build)
        run: npm --prefix web ci && npm --prefix web run build
      - run: cargo doc --no-deps --all-features

  docs-check:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history: the prose check compares with the point where
      # the branch left its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/check-docs.py
      # Regulatory citation wordings that were found wrong (a DORA paragraph
      # that does not exist, a retention period DORA does not set) must not
      # come back in docs, seeds or fixtures.
      - run: python3 scripts/check-citations.py
      # No em or en dash and no Title Case heading in a line that the pull
      # request adds to a markdown file or to the html of the site.
      - name: Prose of the added lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check-prose.py "origin/${BASE_REF:-main}"

  forecastd:
    name: Forecast sidecar (stub model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The minor version the image runs (forecastd/Dockerfile) and the lock
      # was compiled for; the runner's own python3 moves with the runner.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m venv .forecastd-venv
      # Exactly what the image installs: every package of the lock, each
      # checked against its hash. The Timestral code is not in the lock (it
      # is built from git in the image) and the weights are not here, so the
      # real-model suite skips; the rest runs against the stub model, the
      # ASGI app and the load order of the weights (a fake loader) included.
      - run: .forecastd-venv/bin/pip install --require-hashes --no-deps -r forecastd/requirements.lock
      - run: .forecastd-venv/bin/pip check
      # The linter is not part of the runtime, so it is not in the lock.
      - run: .forecastd-venv/bin/pip install --no-deps ruff==0.16.10
      - run: .forecastd-venv/bin/ruff check forecastd
      - name: Unit tests
        working-directory: forecastd
        run: ../.forecastd-venv/bin/python -m unittest discover -s tests -t . -v
      - run: bash -n scripts/proof/rip-phase3-forecast/proof.sh

  scripts-quality:
    name: Python, SQL and distribution checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python3 -m venv .quality-venv
      - run: .quality-venv/bin/pip install -r requirements-quality.txt
      - run: .quality-venv/bin/black --check scripts demo/proof
      - run: .quality-venv/bin/ruff check scripts demo/proof
      - run: .quality-venv/bin/sqlfluff lint docker/init-postgres.sql
      - run: bash scripts/lint-embedded-sql.sh
      # Log events have a constant message, a stable name and vocabulary
      # field names (docs/guides/logging.md). Crates not converted yet are
      # listed in DEFERRED inside the script.
      - run: python3 scripts/test-check-log-messages.py
      - run: python3 scripts/check-log-messages.py
      - run: python3 scripts/test-distribution.py
      - run: bash -n scripts/smoke-daemon-image.sh
      - run: python3 scripts/test-smoke-daemon-image.py
      - run: python3 scripts/test-smoke-daemon-binary.py
      - run: bash -n scripts/demo-check.sh
      - run: python3 scripts/test-starmap-check.py
      - run: python3 scripts/test-check-proof-journals.py
      - run: bash -n scripts/demo-topology.sh
      - run: python3 scripts/test-demo-topology.py
      - run: python3 scripts/test-check-test-hygiene.py
      - run: python3 scripts/check-test-hygiene.py
      - run: python3 scripts/test-check-prose.py
      # Every picture a page names exists, and every picture of docs/images
      # and docs/assets is named by a page or listed in images-allow.txt.
      - run: python3 scripts/test-check-images.py
      - run: python3 scripts/test-check-pr-body.py
      - run: python3 scripts/test-quality-gates.py
