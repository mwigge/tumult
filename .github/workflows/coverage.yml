name: Coverage

on:
  # The project mandates >= 90% workspace coverage. Tarpaulin takes ~2h, which
  # made it the pipeline bottleneck when it ran per PR — a stack of small PRs
  # (each ADDING tests) serialized behind days of instrumented runs. The gate
  # therefore lives on main: every merge and the nightly run verify the floor,
  # and a regression is closed by a targeted test backfill (proven when main
  # drifted to 83.08% while this job was broken — issue #192). The 90% floor
  # is NOT negotiable: do not lower it.
  push:
    branches: [main]
  schedule:
    # Runs nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Line tables suffice for tarpaulin's line coverage and keep instrumented
  # object files small enough to link on a standard runner (full debuginfo
  # made ld die with SIGBUS from disk pressure on the duckdb/arrow crates).
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # The instrumented full-workspace build + test run takes ~120 min with the
    # current test count; 120 exactly cancelled the job at the wire (run
    # 30809935772 died at 120m16s), so leave real headroom.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # The instrumented workspace build (duckdb/parquet/arrow + the typst/pdf
      # stack) overfills the runner disk and ld dies with SIGBUS mid-link;
      # reclaim everything the job provably does not use (~25 GB).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/share/swift /usr/share/miniconda /opt/az /usr/lib/jvm
          sudo docker system prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # tumultd rust-embeds web/build/ at compile time; without this the
      # tarpaulin build below fails on the tumultd crate.
      - name: Build web UI (tumultd embeds web/build)
        run: npm --prefix web ci && npm --prefix web run build
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run tarpaulin
        # Exclusions are platform/scope-honest, not coverage gaming:
        # tumult-windows only runs on Windows; demo-control-panel is a demo
        # binary, not product code. Neither can be executed on this runner.
        run: cargo tarpaulin --workspace --exclude tumult-windows --exclude demo-control-panel --out xml --timeout 300 --fail-under 90
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: cobertura.xml
