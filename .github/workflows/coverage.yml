name: Coverage

on:
  # The project mandates >= 90% workspace coverage. Tarpaulin takes ~2h, which
  # made it the pipeline bottleneck when it ran per PR — a stack of small PRs
  # (each ADDING tests) serialized behind days of instrumented runs. The gate
  # therefore lives on main: every merge and the nightly run verify the floor,
  # and a regression is closed by a targeted test backfill (proven when main
  # drifted to 83.08% while this job was broken — issue #192). The 90% floor
  # is NOT negotiable: do not lower it.
  push:
    branches: [main]
  schedule:
    # Runs nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Bundled DuckDB JSON/Parquet add large native debug sections and relocations.
  # Coverage measures workspace Rust; omit C++ dependency debug data from
  # each linked test executable.
  CXXFLAGS: -g0

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # The instrumented full-workspace build + test run takes ~120 min with the
    # current test count; 120 exactly cancelled the job at the wire (run
    # 30809935772 died at 120m16s), so leave real headroom.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The instrumented workspace build (duckdb/parquet/arrow + the typst/pdf
      # stack) overfills the runner disk and ld dies with SIGBUS mid-link;
      # reclaim everything the job provably does not use (~25 GB).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/share/swift /usr/share/miniconda /opt/az /usr/lib/jvm
          sudo docker system prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # tumultd rust-embeds web/build/ at compile time; without this the
      # tarpaulin build below fails on the tumultd crate.
      - name: Build web UI (tumultd embeds web/build)
        run: npm --prefix web ci && npm --prefix web run build
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --version 0.37.6 --locked
      - name: Run tarpaulin
        # The exclusion is platform-honest, not coverage gaming:
        # tumult-windows only runs on Windows, so it cannot be executed on
        # this runner.
        # Tarpaulin builds every crate with full debug info: its own
        # -Cdebuginfo=2 wins over the profile. That debug info was over 80 %
        # of each test binary, and the test binaries filled the runner disk.
        # The llvm engine reads only its own coverage sections, never the
        # debug info, so the linker drops the debug info from each binary.
        # The llvm engine runs the tests of a binary one at a time, and its
        # --timeout is the time the whole binary may take, not one test.
        # The api tests of tumult-api take 8 to 11 minutes like that, so
        # each binary gets 20 minutes. A hung test still fails the run.
        run: cargo tarpaulin --workspace --exclude tumult-windows --engine llvm --rustflags=-Clink-arg=-Wl,--strip-debug --out xml --timeout 1200 --fail-under 90
      - name: Report build resource usage
        if: always()
        run: |
          df -h / /tmp
          free -h
          if [ -d target ]; then
            du -h --max-depth=2 target | sort -h | tail -n 20
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: cobertura.xml
