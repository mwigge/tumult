name: Examples proof

# Runs every experiment and GameDay that examples/expectations.json and
# gamedays/expectations.json give to the proof `examples-proof`, against the
# docker-compose lab and the demo app on a GitHub runner. The journal of each
# run is then compared with what its entry says it must hold, and uploaded as
# evidence. A second job runs the proof scripts under scripts/proof/.
#
# Starts on a pull request that touches an example, a GameDay, a proof script
# or the lab, once a month, and by hand. Started by hand on a branch with
# `commit: true`, it also commits the journals to that branch.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the journals to the branch the run was started on"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 1 * *" # monthly validation (artifacts only)
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "gamedays/**"
      - "scripts/proof/**"
      - "scripts/check-proof-journals.py"
      - "docker/docker-compose.yml"
      - "docker/Dockerfile.sshd"
      - ".github/workflows/examples-proof.yml"

permissions:
  contents: read

concurrency:
  group: examples-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OHA_VERSION: v1.16.0
  OHA_SHA256: 620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716

jobs:
  prove:
    name: Experiments against the lab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TUMULT: ${{ github.workspace }}/target/release/tumult
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # net-chaos starts tumult-net-proxyd, which the CLI looks for next to
      # its own binary.
      - name: Build tumult and the network proxy
        run: cargo build --release -p tumult-cli -p tumult-net

      # apt reads a plain OpenPGP keyring, not the keybox that
      # `gpg --keyring` writes. The key of k6 is taken only when its one
      # primary key has the pinned fingerprint.
      - name: Install k6, stress-ng and dig
        run: |
          curl -fsSL https://dl.k6.io/key.gpg -o "$RUNNER_TEMP/k6.asc"
          primary=$(gpg --show-keys --with-colons "$RUNNER_TEMP/k6.asc" \
            | awk -F: '/^pub/ {p = 1; next} p && /^fpr/ {print $10; p = 0}')
          test "$primary" = C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          sudo gpg --dearmor --yes -o /usr/share/keyrings/k6-archive-keyring.gpg "$RUNNER_TEMP/k6.asc"
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends k6 stress-ng dnsutils

      - name: Install oha
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oha" "https://github.com/hatoo/oha/releases/download/${OHA_VERSION}/oha-linux-amd64"
          echo "${OHA_SHA256}  ${RUNNER_TEMP}/oha" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/oha" /usr/local/bin/oha

      # network-latency, pumba-latency and checkout-ramp-k6 delay packets
      # with netem. The runner kernel ships it in the extra modules package.
      - name: Load the netem kernel module
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }

      - name: Start the lab and the demo app
        working-directory: docker
        run: |
          docker compose -p docker up -d --wait postgres redis kafka mysql sshd
          docker compose -f docker-compose.demo.yml up -d --wait demo-postgres demo-app
          # The experiments run this Pumba, pinned by digest. Their stress steps
          # start the sshd image of the lab, so Pumba pulls no stress-ng image.
          docker pull ghcr.io/alexei-led/pumba:1.6.0@sha256:11ed15538c7ec688628e2f53917d949e8c16418c146742731c3030ef276b6057
          # ssh-remote logs in to the lab SSH server with the key of its image.
          docker cp "$(docker compose -p docker ps -q sshd):/test_key" /tmp/tumult-test-key
          chmod 600 /tmp/tumult-test-key
          docker ps --format "  {{.Names}} ({{.Status}})"

      # A run that ends non-zero does not stop the loop: the gate below reads
      # every journal, and some runs are expected to end that way.
      - name: Run the experiments
        run: |
          mkdir -p examples/recorded
          python3 scripts/check-proof-journals.py --proof examples-proof \
            --list examples/expectations.json > "$RUNNER_TEMP/experiments"
          while read -r file; do
            name="${file%.toon}"
            # The journal in the checkout is removed first, so the gate cannot
            # read one that this run did not write.
            rm -f "examples/recorded/$name.journal.toon"
            run=("$TUMULT" run "examples/$file" --journal-path "examples/recorded/$name.journal.toon" --no-ingest)
            # dns-redirect-chaos edits /etc/hosts, so it runs as root.
            if [ "$name" = dns-redirect-chaos ]; then
              run=(sudo -E env "PATH=$PATH" "${run[@]}")
            fi
            echo "::group::$name"
            "${run[@]}" < /dev/null || echo "$name ended with exit code $?"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/experiments"
          # The run as root leaves a journal only root can read.
          sudo chown -R "$(id -u):$(id -g)" examples/recorded

      # A GameDay writes its journal next to its definition. The journal in
      # the checkout is removed first, so the gate cannot read one that this
      # run did not write.
      - name: Run the GameDays
        run: |
          for gameday in gamedays/*.gameday.toon; do
            rm -f "${gameday%.toon}.journal.toon"
            echo "::group::$gameday"
            "$TUMULT" gameday run "$gameday" < /dev/null || echo "$gameday ended with exit code $?"
            echo "::endgroup::"
          done

      - name: Gate, every journal holds what its expectations entry says
        run: |
          failed=0
          python3 scripts/check-proof-journals.py --proof examples-proof \
            examples/expectations.json examples/recorded || failed=1
          python3 scripts/check-proof-journals.py --proof examples-proof \
            gamedays/expectations.json gamedays || failed=1
          exit "$failed"

      - name: Upload journals as evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-journals
          path: |
            examples/recorded/**
            gamedays/*.gameday.journal.toon

      - name: Tear down
        if: always()
        working-directory: docker
        run: |
          docker compose -f docker-compose.demo.yml down -v
          docker compose -p docker down -v

  proof-scripts:
    name: Proof scripts
    runs-on: ubuntu-latest
    # A build of tumultd without a cache takes 45 minutes on a runner.
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # tumultd embeds web/build at compile time.
      - name: Build the web UI
        run: npm --prefix web ci && npm --prefix web run build

      - name: Build tumult and tumultd
        run: cargo build -p tumultd -p tumult-cli

      - name: Install oha
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oha" "https://github.com/hatoo/oha/releases/download/${OHA_VERSION}/oha-linux-amd64"
          echo "${OHA_SHA256}  ${RUNNER_TEMP}/oha" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/oha" /usr/local/bin/oha

      - name: Posture and risks proof
        run: bash scripts/proof/rip-phase2/proof.sh

      - name: Performance verdict proof
        run: bash scripts/proof/rip-phase4/proof.sh

  record:
    name: Commit the journals
    needs: prove
    if: inputs.commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-journals

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/recorded gamedays/*.gameday.journal.toon
          git commit -m "chore(examples): regenerate recorded proof journals [skip ci]" || echo "nothing to commit"
          git push
