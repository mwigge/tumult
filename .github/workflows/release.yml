name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

          # Linux (GNU — x86_64 only, ARM64 uses musl for DuckDB compat)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          # Linux (musl — fully static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # tumultd rust-embeds web/build/ at compile time.
      - name: Build web UI (tumultd embeds web/build)
        run: npm --prefix web ci && npm --prefix web run build

      - name: Run tests before release
        if: ${{ !matrix.cross }}
        run: cargo test --workspace

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p tumult-cli -p tumultd

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p tumult-cli -p tumultd

      - name: Strip binaries (Linux)
        if: contains(matrix.target, 'linux') && !matrix.cross
        run: strip target/${{ matrix.target }}/release/tumult target/${{ matrix.target }}/release/tumultd

      - name: Strip binaries (macOS)
        if: contains(matrix.target, 'apple')
        run: strip target/${{ matrix.target }}/release/tumult target/${{ matrix.target }}/release/tumultd

      - name: Package
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ARCHIVE="tumult-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE}"
          cp target/${{ matrix.target }}/release/tumult "${ARCHIVE}/"
          cp README.md CHANGELOG.md LICENSE "${ARCHIVE}/" 2>/dev/null || true
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          echo "ARCHIVE=${ARCHIVE}.tar.gz" >> $GITHUB_ENV
          ARCHIVE_D="tumultd-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_D}"
          cp target/${{ matrix.target }}/release/tumultd "${ARCHIVE_D}/"
          cp README.md CHANGELOG.md LICENSE "${ARCHIVE_D}/" 2>/dev/null || true
          tar czf "${ARCHIVE_D}.tar.gz" "${ARCHIVE_D}"
          echo "ARCHIVE_D=${ARCHIVE_D}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tumult-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

      - name: Upload tumultd artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tumultd-${{ matrix.target }}
          path: ${{ env.ARCHIVE_D }}

  docker:
    name: Publish tumult image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: docker/Dockerfile.tumult
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tumult:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tumult:latest
          cache-from: type=gha
          # ignore-error: a transient GHCR/GitHub-cache hiccup must not fail
          # a release whose image already built and pushed successfully.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/tumult:${{ steps.version.outputs.version }} --version

  docker-mcp:
    name: Publish tumult-mcp image
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: docker/Dockerfile.tumult-mcp
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tumult-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tumult-mcp:latest
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/tumult:${{ steps.version.outputs.version }}

      - name: Smoke test
        run: |
          # The tumult-mcp image selects the authenticated HTTP server,
          # so we override to run the tumult CLI binary that's also in the image.
          docker run --rm --entrypoint tumult ghcr.io/${{ github.repository_owner }}/tumult-mcp:${{ steps.version.outputs.version }} --version

  release:
    name: Create Release
    needs: [build, docker, docker-mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts/
          # single glob — download-artifact treats a multi-line pattern as
          # one literal string and matches nothing; tumult* covers both
          # tumult-<target> and tumultd-<target>
          pattern: tumult*

      - name: Collect tarballs
        run: |
          mkdir -p release/
          find artifacts/ -name '*.tar.gz' -exec cp {} release/ \;
          ls -lh release/

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            release/*.tar.gz
            release/SHA256SUMS.txt
          body: |
            ## Docker Images

            Both images contain the Tumult CLI, MCP server, bundled plugins,
            examples, and GameDay definitions. Run `tumult discover` in the
            image for the authoritative plugin and action catalog.

            | Image | Description | Pull |
            |-------|-------------|------|
            | `tumult` | CLI tool (default entrypoint) | `docker pull ghcr.io/mwigge/tumult:${{ steps.version.outputs.version }}` |
            | `tumult-mcp` | MCP server (Streamable HTTP mode) | `docker pull ghcr.io/mwigge/tumult-mcp:${{ steps.version.outputs.version }}` |

            ```bash
            # Run CLI commands
            docker run ghcr.io/mwigge/tumult:${{ steps.version.outputs.version }} discover
            docker run ghcr.io/mwigge/tumult:${{ steps.version.outputs.version }} --help

            # Start MCP server
            docker run -e TUMULT_MCP_TOKEN=replace-with-a-secret -p 3100:3100 ghcr.io/mwigge/tumult-mcp:${{ steps.version.outputs.version }}

            # Or use the CLI image with MCP entrypoint override
            docker run -e TUMULT_MCP_TOKEN=replace-with-a-secret -p 3100:3100 --entrypoint tumult-mcp ghcr.io/mwigge/tumult:${{ steps.version.outputs.version }} --transport http --host 0.0.0.0
            ```

            ## Binary Downloads

            See assets below. One-liner install:

            macOS (Intel/Apple Silicon):
            ```bash
            curl -fsSL https://github.com/mwigge/tumult/releases/download/v${{ steps.version.outputs.version }}/tumult-v${{ steps.version.outputs.version }}-$(uname -m | sed 's/arm64/aarch64/')-apple-darwin.tar.gz | tar xz && sudo mv tumult-*/tumult /usr/local/bin/
            ```

            Linux (x86_64):
            ```bash
            curl -fsSL https://github.com/mwigge/tumult/releases/download/v${{ steps.version.outputs.version }}/tumult-v${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz | tar xz && sudo mv tumult-*/tumult /usr/local/bin/
            ```
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
