version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # duckdb is in no group, so a move of the DuckDB engine comes as a pull
    # request of its own. Cargo.toml pins it with a tilde: only a duckdb-rs
    # patch for the same engine can come as a change of Cargo.lock alone.
    # arrow and parquet keep the arrow major that duckdb-rs builds on. A new
    # major moves by hand, in the pull request that moves duckdb.
    ignore:
      - dependency-name: "arrow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "parquet"
        update-types: ["version-update:semver-major"]
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      arrow-parquet:
        patterns:
          - "arrow"
          - "parquet"

  # The demo crates are cargo workspaces of their own, each with its own
  # Cargo.lock.
  - package-ecosystem: cargo
    directories:
      - /demo/app
      - /demo/control-panel
      - /demo/traffic
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      arrow-parquet:
        patterns:
          - "arrow"
          - "parquet"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
