version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      arrow-parquet:
        patterns:
          - "arrow"
          - "parquet"
          - "duckdb"

  # The demo crates are cargo workspaces of their own, each with its own
  # Cargo.lock.
  - package-ecosystem: cargo
    directories:
      - /demo/app
      - /demo/control-panel
      - /demo/traffic
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      arrow-parquet:
        patterns:
          - "arrow"
          - "parquet"
          - "duckdb"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
